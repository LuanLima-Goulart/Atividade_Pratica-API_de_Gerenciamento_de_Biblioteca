<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <header>
        <section class="tituloLogin">
            <h1>Faça login nessa porra de site!</h1>
            <h2>Use seu email e senha!</h2>
        </section>
    </header>
    <main>
        <section class="login">
            <label for="email">E-mail</label>
            <br>
            <input id="email" type="email" placeholder="Escreva seu E-mail:" required>
            <br>
            <label for="senha">Senha</label>
            <br>
            <input id="senha" type="password" placeholder="Escreva sua senha:" required>
        </section>
        <br>
        <section class="loginEsqueceuSenha">
            <a class="esqueceuSenha" href="esqueceuSenha.html">
                <p>Esqueceu a Senha?</p>
            </a>
        </section>
        <br>
        <section>
            <button id="submit" type="submit">Login</button>
        </section>
        <br>
        <section>
            <p>Não tem conta?</p>
            <a class="cadastrarConta" href="cadastrar.html">
                <p>Cadastre-se</p>
            </a>
        </section>
    </main>
    <footer></footer>
</body>

</html>
